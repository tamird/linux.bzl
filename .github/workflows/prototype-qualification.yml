name: Measured kernel qualification

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        options: [native-config, syntax, native-tools, full]
        default: native-config

permissions:
  contents: read

concurrency:
  group: native-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    uses: ./.github/workflows/kernel.yml
    with:
      scope: ${{ inputs.scope }}

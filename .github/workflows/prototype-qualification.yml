name: Prototype qualification

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment to run
        type: choice
        default: all
        options: [all, configuration-parity, source-edit-reuse, compiler-ir, compiler-family, examples, generator]
      checkpoint_run:
        description: Completed run supplying compiler-family evidence (empty for a fresh run)
        type: string
        default: ""
      checkpoint_sha256:
        description: Verified SHA256 of that run's prototype-compiler-family ZIP
        type: string
        default: ""
      family_phases:
        description: Bounded prefix of the still-missing family phases
        type: choice
        default: debug
        options: [debug, btf, changed, "debug btf", "btf changed", "debug btf changed"]

permissions:
  contents: read
  actions: read

jobs:
  examples:
    if: inputs.checkpoint_run == '' && (inputs.experiment == 'all' || inputs.experiment == 'examples' || inputs.experiment == 'generator')
    uses: ./.github/workflows/kernel-repository.yml
    with:
      verify_only: ${{ inputs.experiment == 'generator' }}

  generator:
    if: inputs.experiment != 'examples' && inputs.experiment != 'generator' && inputs.checkpoint_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      USE_BAZEL_VERSION: 9.1.0
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: kernel-repository
          repository-cache: true
      - name: Build and test the current generator
        run: |
          bazel test //:prototype_test //:repository_test --platforms=@llvm//platforms:linux_x86_64_musl --jobs=4 --test_output=errors
          bazel build //:consumer_support --platforms=@llvm//platforms:linux_x86_64_musl --jobs=4
      # Qualify a source-specific release asset for external consumers. The
      # maintained family below retains the default source/generator pair.
      - name: Qualify the Linux 6.18 consumer generator
        if: inputs.experiment == 'compiler-family'
        run: |
          bazel test //native/linux_6_18:repository_test --platforms=@llvm//platforms:linux_x86_64_musl --jobs=4 --test_output=errors
          bazel build //native/linux_6_18:consumer_support --platforms=@llvm//platforms:linux_x86_64_musl --jobs=4
      - name: Verify declared Linux 6.18 toolchain capabilities
        if: inputs.experiment == 'compiler-family'
        run: |
          mkdir -p _tmp/capability-generator _tmp/capability-reports
          tar -xzf bazel-bin/native/linux_6_18/consumer-support.tar.gz -C _tmp/capability-generator
          source_anchor=$(bazel cquery @linux_6_18//:Makefile --platforms=@llvm//platforms:linux_x86_64_musl --output=files)
          source_root="$(bazel info output_base)/$(dirname "$source_anchor")"
          python3 example.py --linux "$source_root" --generated _tmp/capability-generator/support --tool _tmp/capability-generator/kernel-repository
          cd examples
          verification_status=0
          for cpu in x86_64 aarch64; do
            flags=(--platforms=@llvm//platforms:linux_$cpu --extra_execution_platforms=@llvm//platforms:linux_x86_64)
            report=$(bazel cquery @kernel//:compiler_capability_checks "${flags[@]}" --output=files | sed -n '/\.report\.json$/p')
            if bazel build @kernel//:compiler_capability_checks "${flags[@]}" --jobs=4; then
              cp "$report" "../_tmp/capability-reports/$cpu.json"
            else
              verification_status=$?
              if [[ -f "$report" ]]; then cp "$report" "../_tmp/capability-reports/$cpu.json" || true; fi
            fi
          done
          exit "$verification_status"
      - uses: actions/upload-artifact@v7
        if: inputs.experiment == 'compiler-family'
        with:
          name: qualification-generator-linux_6_18
          path: bazel-bin/native/linux_6_18/consumer-support.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-generator
          path: bazel-bin/consumer-support.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qualification-generator-logs
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/repository_test/test.outputs/**
            _tmp/capability-reports/*.json
          retention-days: 14

  qualify:
    if: ${{ always() && !cancelled() && inputs.experiment != 'generator' && (needs.generator.result == 'success' || inputs.checkpoint_run != '') }}
    name: ${{ matrix.experiment }}
    runs-on: ubuntu-24.04
    needs: generator
    timeout-minutes: ${{ (matrix.experiment == 'compiler-family' || matrix.experiment == 'source-edit-reuse') && 360 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        experiment: ${{ inputs.experiment == 'all' && fromJSON('["configuration-parity", "source-edit-reuse", "compiler-family"]') || fromJSON(format('["{0}"]', inputs.experiment)) }}
    env:
      USE_BAZEL_VERSION: 9.1.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkpoint_run != '' && '3fe23f567c268c87cd3752545698fad20d6800cb' || github.sha }}
      - name: Restore completed family phases
        if: inputs.checkpoint_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN: ${{ inputs.checkpoint_run }}
          CHECKPOINT_SHA256: ${{ inputs.checkpoint_sha256 }}
          FAMILY_PHASES: ${{ inputs.family_phases }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          test "$EXPERIMENT" = compiler-family
          [[ "$CHECKPOINT_RUN" =~ ^[0-9]+$ ]]
          [[ "$CHECKPOINT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          source_sha=3fe23f567c268c87cd3752545698fad20d6800cb
          generator_sha=8fb8d93c992ebfc5dfc94cd7f9fec68ff07a11e11d962bfc8bcafd9cd602c06f
          test "$(git rev-parse HEAD)" = "$source_sha"
          results="$RUNNER_TEMP/linux-prototype-qualification"
          mkdir -p "$results/diagnostics" "$results/mismatches"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39118009561" > "$results/origin-run.json"
          jq -e --arg sha "$source_sha" '.id == 39118009561 and .head_sha == $sha and .status == "completed"' "$results/origin-run.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECKPOINT_RUN" > "$results/checkpoint-run.json"
          jq -e '.status == "completed"' "$results/checkpoint-run.json" > /dev/null
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CHECKPOINT_RUN/artifacts" --paginate |
            jq -r --arg digest "sha256:$CHECKPOINT_SHA256" '.artifacts[] | select(.name == "prototype-compiler-family" and .expired == false and .digest == $digest) | .id')
          [[ "$artifact" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/family-checkpoint.zip"
          echo "$CHECKPOINT_SHA256  $RUNNER_TEMP/family-checkpoint.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/family-checkpoint.zip" '_temp/linux-prototype-qualification/*' -d "$RUNNER_TEMP/family-checkpoint"
          prior="$RUNNER_TEMP/family-checkpoint/_temp/linux-prototype-qualification"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39118009561/artifacts" --paginate |
            jq -s '[.[].artifacts[] | select(.name == "prototype-compiler-family" and .expired == false)] |
              if length == 1 then .[0] else error("Expected one original family artifact") end' > "$results/origin-artifact.json"
          origin_id=$(jq -r .id "$results/origin-artifact.json")
          origin_digest=$(jq -r .digest "$results/origin-artifact.json")
          [[ "$origin_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          origin_zip="$RUNNER_TEMP/family-checkpoint.zip"
          if [[ "$CHECKPOINT_RUN" != 39118009561 ]]; then
            origin_zip="$RUNNER_TEMP/family-origin.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$origin_id/zip" > "$origin_zip"
          else
            test "$artifact" = "$origin_id"
          fi
          echo "${origin_digest#sha256:}  $origin_zip" | sha256sum --check
          unzip -Z -1 "$origin_zip" > "$RUNNER_TEMP/family-origin.paths"
          : > "$results/original-phase-files.sha256"
          if [[ "$CHECKPOINT_RUN" == 39118009561 ]]; then
            jq -n '{checkpoints: []}' > "$RUNNER_TEMP/prior-provenance.json"
          else
            jq -e --arg sha "$source_sha" --arg generator "$generator_sha" \
              '.source_sha == $sha and .origin_run == 39118009561 and .generator_sha256 == $generator and (.checkpoints | type == "array")' \
              "$prior/family-provenance.json" > /dev/null
            cp "$prior/family-provenance.json" "$RUNNER_TEMP/prior-provenance.json"
          fi
          jq --arg sha "$source_sha" --arg generator "$generator_sha" --arg digest "$CHECKPOINT_SHA256" \
            --argjson run "$CHECKPOINT_RUN" --argjson artifact "$artifact" \
            --arg head "$(jq -r .head_sha "$results/checkpoint-run.json")" \
            '.source_sha=$sha | .origin_run=39118009561 | .generator_sha256=$generator | .checkpoints += [{run:$run,head:$head,artifact:$artifact,sha256:$digest}]' \
            "$RUNNER_TEMP/prior-provenance.json" > "$results/family-provenance.json"
          # ir.json is written last by snapshot; incomplete phases are not restored.
          missing=()
          restored=()
          for phase in base unchanged lz4 debug btf changed; do
            files=("$phase.ir.json" "$phase.products.json" "$phase.execution.jsonl" "$phase.compiler.json"
              "$phase.aquery.json" "$phase.execution.pb.zst" "$phase.profile.gz"
              "diagnostics/$phase/report.json" "diagnostics/$phase/attribute.bc" "diagnostics/$phase/assembly.bc")
            complete=true
            for file in "${files[@]}"; do
              if [[ ! -s "$prior/$file" ]]; then complete=false; fi
            done
            if "$complete"; then
              test "${#missing[@]}" -eq 0
              jq -e . "$prior/$phase.ir.json" > /dev/null
              for file in "${files[@]}"; do
                mkdir -p "$results/$(dirname "$file")"
                cp "$prior/$file" "$results/$file"
              done
              if [[ -d "$prior/mismatches/$phase" ]]; then cp -a "$prior/mismatches/$phase" "$results/mismatches/"; fi
              restored+=("${files[@]}")
              # Anchor every original completed phase directly to its authenticated ZIP.
              if grep -Fxq "_temp/linux-prototype-qualification/$phase.ir.json" "$RUNNER_TEMP/family-origin.paths"; then
                for file in "${files[@]}"; do
                  digest=$(unzip -p "$origin_zip" "_temp/linux-prototype-qualification/$file" | sha256sum | cut -d ' ' -f 1)
                  printf '%s  %s\n' "$digest" "$file" >> "$results/original-phase-files.sha256"
                done
              else
                case "$phase" in base|unchanged|lz4) echo "Original phase is not authenticated: $phase" >&2; exit 1 ;; esac
              fi
            else
              case "$phase" in base|unchanged|lz4) echo "Required original phase is incomplete: $phase" >&2; exit 1 ;; esac
              missing+=("$phase")
            fi
          done
          (cd "$results"; sha256sum --check original-phase-files.sha256)
          if [[ "$CHECKPOINT_RUN" != 39118009561 ]]; then
            cmp "$prior/original-phase-files.sha256" "$results/original-phase-files.sha256"
          fi
          read -r -a selected <<< "$FAMILY_PHASES"
          test "${#selected[@]}" -gt 0
          test "${#selected[@]}" -le "${#missing[@]}"
          for i in "${!selected[@]}"; do test "${selected[$i]}" = "${missing[$i]}"; done
          (cd "$results"; sha256sum "${restored[@]}") > "$RUNNER_TEMP/family-restored.sha256"
      - name: Checkout the generator's pinned kernel
        uses: actions/checkout@v5
        with:
          repository: torvalds/linux
          ref: 0fcb05b72344f40806cbe810de8872f1698bf053
          path: _tmp/linux
          persist-credentials: false
      - name: Declare the compressed image's assembler input
        run: git -C _tmp/linux apply "$GITHUB_WORKSPACE/native/linux_piggy_dependency.patch"
      - uses: actions/download-artifact@v8
        with:
          name: qualification-generator
          path: _tmp/kernel-repository
          run-id: ${{ inputs.checkpoint_run != '' && '39118009561' || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the original family generator
        if: inputs.checkpoint_run != ''
        run: echo "8fb8d93c992ebfc5dfc94cd7f9fec68ff07a11e11d962bfc8bcafd9cd602c06f  _tmp/kernel-repository/consumer-support.tar.gz" | sha256sum --check
      - name: Configure the consumer with the current generator
        run: |
          mkdir -p "$RUNNER_TEMP/linux-prototype-qualification" _tmp/kernel-repository
          tar -xzf _tmp/kernel-repository/consumer-support.tar.gz -C _tmp/kernel-repository
          python3 example.py --generated _tmp/kernel-repository/support
      - name: Supply the original declared Cosmos downloads
        if: inputs.checkpoint_run != ''
        run: |
          set -euo pipefail
          distdir="$RUNNER_TEMP/linux-prototype-qualification/ape-distdir"
          mkdir -p "$distdir"
          curl --fail --location --connect-timeout 15 --max-time 90 \
            --output "$distdir/assimilate" \
            https://gitlab.arm.com/api/v4/projects/10212/packages/generic/cosmos.zip/4.0.2/assimilate
          curl --fail --location --connect-timeout 15 --max-time 90 \
            --output "$distdir/ape-x86_64.elf" \
            https://gitlab.arm.com/api/v4/projects/10212/packages/generic/cosmos.zip/4.0.2/ape-x86_64.elf
          curl --fail --location --connect-timeout 15 --max-time 90 \
            --output "$distdir/bzip2" \
            https://gitlab.arm.com/api/v4/projects/10212/packages/generic/cosmos.zip/4.0.2/bzip2
          curl --fail --location --connect-timeout 15 --max-time 90 \
            --output "$distdir/gzip.ape" \
            https://gitlab.arm.com/api/v4/projects/10212/packages/generic/cosmos.zip/4.0.2/gzip.ape
          curl --fail --location --connect-timeout 15 --max-time 90 \
            --output "$distdir/xz" \
            https://gitlab.arm.com/api/v4/projects/10212/packages/generic/cosmos.zip/3.3.1/xz
          # The original APE 1.0.1 locks select these five Linux x86 tool blobs.
          printf '%s  %s\n' \
            93f63aac14046bc2530e4f98ff4dc7ade2e3a3aa3136ced3db598bf6b0026edc "$distdir/assimilate" \
            7c1cf8b24e1b6dd6ad7da3817045d582ada146b4d6ec0c6a45bea830e3a65f4d "$distdir/ape-x86_64.elf" \
            594da492f43db9db3ef838ca10b11bdc2b9690bf7a1dfb7aeafeff75de87dd27 "$distdir/bzip2" \
            c4b948a5befb1fc8bdb5d808636e69901223e01848c38a56b9c62195b743cdff "$distdir/gzip.ape" \
            f385552c4be430554ab0d4ca5fc219f745c0a9e6c7a1f2786eccb72777fe5ded "$distdir/xz" \
            > "$RUNNER_TEMP/linux-prototype-qualification/ape-downloads.sha256"
          sha256sum --check "$RUNNER_TEMP/linux-prototype-qualification/ape-downloads.sha256"
      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            startup --host_jvm_args=-Xmx8g
            ${{ inputs.checkpoint_run != '' && format('common --distdir={0}/linux-prototype-qualification/ape-distdir', runner.temp) || '' }}
          bazelisk-cache: true
          disk-cache: prototype-qualification-${{ matrix.experiment }}
          repository-cache: true
      - name: Compare native and prototype configurations
        if: matrix.experiment == 'configuration-parity'
        working-directory: examples
        run: bazel test //qualification:parity --jobs=4 --keep_going --test_output=errors
      - name: Check qualification helpers
        if: matrix.experiment == 'source-edit-reuse' || matrix.experiment == 'compiler-ir' || matrix.experiment == 'compiler-family'
        working-directory: examples
        run: >-
          bazel test //qualification:reuse_report_test
          @kernel//architecture_tests:native_shell_test
          --platforms=@llvm//platforms:linux_x86_64
          --extra_execution_platforms=@llvm//platforms:linux_x86_64 --test_output=errors
      - name: Fetch the compact execution log decoder
        if: matrix.experiment == 'source-edit-reuse' || matrix.experiment == 'compiler-ir' || matrix.experiment == 'compiler-family'
        run: |
          decoder="$RUNNER_TEMP/linux-prototype-qualification/bb"
          curl --fail --location --output "$decoder" https://github.com/buildbuddy-io/bazel/releases/download/5.0.492/bazel-5.0.492-linux-x86_64
          echo "e9e996a1a01555e45433acf9432f9d40d5bda437812a830d6701fe9b09853df9  $decoder" | sha256sum --check
          chmod +x "$decoder"
      - name: Measure unchanged and edited source builds
        if: matrix.experiment == 'source-edit-reuse'
        # Reserve job time for evidence upload and cache post steps.
        timeout-minutes: 330
        working-directory: examples
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/linux-prototype-qualification"
          mapping=(--experimental_output_paths=strip --modify_execution_info=CppCompile=+supports-path-mapping --platforms=@llvm//platforms:linux_x86_64)
          source_file="$GITHUB_WORKSPACE/_tmp/linux/init/main.c"
          header_file="$GITHUB_WORKSPACE/_tmp/linux/init/do_mounts.h"
          payload_file="$GITHUB_WORKSPACE/_tmp/linux/usr/default_cpio_list"
          gzip_makefile="$GITHUB_WORKSPACE/_tmp/linux/scripts/Makefile.lib"
          cp "$source_file" "$results/main.c.original"
          cp "$header_file" "$results/do_mounts.h.original"
          cp "$payload_file" "$results/default_cpio_list.original"
          cp "$gzip_makefile" "$results/Makefile.lib.original"
          trap 'cp "$results/main.c.original" "$source_file"; cp "$results/do_mounts.h.original" "$header_file"; cp "$results/default_cpio_list.original" "$payload_file"; cp "$results/Makefile.lib.original" "$gzip_makefile"' EXIT
          for phase in baseline unchanged edited header incbin gzip; do
            case "$phase" in
              edited) printf '\n/* prototype reuse experiment %s/%s */\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$source_file" ;;
              header) printf '\n/* prototype header experiment %s/%s */\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$header_file" ;;
              incbin) printf '\ndir /linux-bzl-incbin-%s-%s 0755 0 0\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$payload_file" ;;
              gzip)
                # Change only gzip's four MTIME bytes. The compressed length,
                # decompressed contents and generated piggy.S must stay equal.
                gzip_nonce=$(printf '%s/%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | cksum | cut -d' ' -f1)
                printf -v gzip_bytes '\\%03o\\%03o\\%03o\\%03o' \
                  "$((gzip_nonce & 255))" "$(((gzip_nonce >> 8) & 255))" \
                  "$(((gzip_nonce >> 16) & 255))" "$(((gzip_nonce >> 24) & 255))"
                printf '\ncmd_gzip += ; printf "%s" | dd of=$@ bs=1 seek=4 conv=notrunc status=none\n' "$gzip_bytes" >> "$gzip_makefile"
                ;;
            esac
            bazel build //:x86_64_kernel --output_groups=+boot,+manifest --jobs=4 "${mapping[@]}" \
              --sandbox_block_path=/bin --sandbox_block_path=/usr/bin --sandbox_block_path=/usr/local/bin \
              --experimental_sandbox_async_tree_delete_idle_threads=0 \
              --execution_log_compact_file="$results/$phase.execution.pb.zst" \
              --profile="$results/$phase.profile.gz"
            # Decode compact entries without expanding every action's source-tree inputs.
            "$results/bb" print --compact_execution_log="$results/$phase.execution.pb.zst" --raw=true --sort=false |
              jq -c '
                if has("invocation") then {invocation: .invocation.id}
                elif has("file") then {id, path: .file.path}
                elif has("directory") then {id, path: .directory.path}
                elif has("unresolvedSymlink") then {id, path: .unresolvedSymlink.path}
                elif has("spawn") then {spawn: (.spawn | {
                  outputs: (.outputs // []), mnemonic, runner: (.runner // ""),
                  cacheHit: (.cacheHit // false),
                  exitCode: (.exitCode // 0),
                  status: (.status // "")
                })}
                else empty end
              ' > "$results/$phase.execution.jsonl"
            bazel aquery 'deps(//:x86_64_kernel)' "${mapping[@]}" --noinclude_pruned_inputs \
              --output=jsonproto --include_commandline=false > "$results/$phase.aquery.json"
            bazel cquery //:x86_64_kernel "${mapping[@]}" --output=files --output_groups=manifest > "$results/$phase.manifest-path"
            bazel run //qualification:reuse_report "${mapping[@]}" -- snapshot "$results" "$phase"
          done
          bazel run //qualification:reuse_report "${mapping[@]}" -- report "$results"
      - name: Qualify native compiler IR and configuration reuse
        if: matrix.experiment == 'compiler-ir' || matrix.experiment == 'compiler-family'
        working-directory: examples
        # Reserve job time for evidence upload and cache saving.
        timeout-minutes: ${{ matrix.experiment == 'compiler-family' && 330 || 150 }}
        env:
          CHECKPOINT_RUN: ${{ inputs.checkpoint_run }}
          FAMILY_PHASES: ${{ inputs.family_phases }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/linux-prototype-qualification"
          mapping=(--experimental_output_paths=strip --modify_execution_info=CppCompile=+supports-path-mapping)
          phases=(base unchanged lz4 changed)
          report_flags=()
          build_flags=(--output_groups=ir_experiment)
          if [[ '${{ matrix.experiment }}' == compiler-family ]]; then
            phases=(base unchanged lz4 debug btf changed)
            if [[ -n "$CHECKPOINT_RUN" ]]; then read -r -a phases <<< "$FAMILY_PHASES"; fi
            report_flags=(--family)
            mapping+=(--platforms=@llvm//platforms:linux_x86_64)
            build_flags=("--output_groups=+kernel,+boot,+modules,+manifest,+ir_experiment"
              --sandbox_block_path=/bin --sandbox_block_path=/usr/bin --sandbox_block_path=/usr/local/bin)
            # Apply backpressure when retiring sandboxes instead of accumulating deletion work.
            build_flags+=(--experimental_sandbox_async_tree_delete_idle_threads=0)
            output_base=$(bazel info output_base)
            output_path=$(bazel info output_path)
            # Read the cache locations declared by setup-bazel for this job.
            disk_cache=$(awk '$1 == "build" && $2 ~ /^--disk_cache=/ {sub(/^--disk_cache=/, "", $2); print $2; count++} END {if (count != 1) exit 1}' "$HOME/.bazelrc")
            repository_cache=$(awk '$1 == "common" && $2 ~ /^--repository_cache=/ {sub(/^--repository_cache=/, "", $2); print $2; count++} END {if (count != 1) exit 1}' "$HOME/.bazelrc")
            storage_report() {
              date -u
              df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
              df -i "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
              for path in "$output_path" "$output_base/external" "$output_base/sandbox" "$disk_cache" "$repository_cache"; do
                if [[ -e "$path" ]]; then
                  du -sh "$path"
                  du -s --inodes "$path"
                fi
              done
            }
            storage_report > "$results/storage-before.log" 2>&1 || true
            trap 'status=$?; if (( status != 0 )); then set +e; storage_report > "$results/storage-failure.log" 2>&1; fi; exit "$status"' EXIT
          fi
          for phase in "${phases[@]}"; do
            variant="$phase"
            if [[ "$variant" == unchanged ]]; then variant=base; fi
            target="//qualification:ir_$variant"
            if [[ '${{ matrix.experiment }}' == compiler-family ]]; then
              case "$variant" in
                base) target=//:x86_64_kernel_qualification ;;
                lz4) target=//:x86_64_lz4_kernel_qualification ;;
                debug) target=//:x86_64_debug_kernel_qualification ;;
                btf) target=//:x86_64_btf_declared_qualification ;;
                changed) target=//qualification:family_changed_qualification ;;
              esac
            fi
            bazel build "$target" "${build_flags[@]}" --jobs=4 \
              "${mapping[@]}" --execution_log_compact_file="$results/$phase.execution.pb.zst" \
              --profile="$results/$phase.profile.gz"
            "$results/bb" print --compact_execution_log="$results/$phase.execution.pb.zst" --raw=true --sort=false |
              jq -c '
                if has("invocation") then {invocation: .invocation.id, hashFunctionName: .invocation.hashFunctionName}
                elif has("file") then {id, path: .file.path}
                elif has("directory") then {id, path: .directory.path}
                elif has("unresolvedSymlink") then {id, path: .unresolvedSymlink.path}
                elif has("spawn") then {spawn: (.spawn | {
                  outputs: (.outputs // []), mnemonic, runner: (.runner // ""),
                  cacheHit: (.cacheHit // false), exitCode: (.exitCode // 0), status: (.status // ""),
                  digest: {hash: (.digest.hash // ""), sizeBytes: (.digest.sizeBytes // 0 | tonumber)}
                })}
                else empty end
              ' > "$results/$phase.execution.jsonl"
            # Preserve actual compiler-discovered inputs, excluding candidates
            # removed by native header discovery after the preceding build.
            bazel aquery "deps($target)" "${mapping[@]}" --noinclude_pruned_inputs --output=jsonproto > "$results/$phase.aquery.json"
            bazel run //qualification:ir_reuse_report "${mapping[@]}" -- snapshot "$results" "$phase" "${report_flags[@]}"
          done
          if [[ -n "$CHECKPOINT_RUN" ]]; then
            (cd "$results"; sha256sum --check "$RUNNER_TEMP/family-restored.sha256")
          fi
          # An incomplete checkpoint still fails the original full-family reporters.
          comparison=0
          reuse=0
          if [[ '${{ matrix.experiment }}' == compiler-family ]]; then
            bazel run //qualification:family_compare "${mapping[@]}" -- --family-results "$results" || comparison=$?
          else
            bazel test //qualification:ir_compare_test "${mapping[@]}" --jobs=4 --test_output=errors || comparison=$?
          fi
          # Emit both independent reports even when one qualification fails.
          bazel run //qualification:ir_reuse_report "${mapping[@]}" -- report "$results" "${report_flags[@]}" || reuse=$?
          test "$comparison" -eq 0 && test "$reuse" -eq 0
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prototype-${{ matrix.experiment }}
          path: |
            ${{ runner.temp }}/linux-prototype-qualification/*.json
            ${{ runner.temp }}/linux-prototype-qualification/*.jsonl
            ${{ runner.temp }}/linux-prototype-qualification/*.manifest-path
            ${{ runner.temp }}/linux-prototype-qualification/*.pb.zst
            ${{ runner.temp }}/linux-prototype-qualification/*.profile.gz
            ${{ runner.temp }}/linux-prototype-qualification/*.sha256
            ${{ runner.temp }}/linux-prototype-qualification/storage-*.log
            ${{ runner.temp }}/linux-prototype-qualification/diagnostics/**
            ${{ runner.temp }}/linux-prototype-qualification/mismatches/**
            examples/bazel-testlogs/qualification/**/test.log
            examples/bazel-testlogs/qualification/**/test.outputs/**
          retention-days: 14

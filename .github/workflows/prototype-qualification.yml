name: Prototype qualification

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment to run
        type: choice
        default: all
        options: [all, configuration-parity, source-edit-reuse, examples]

permissions:
  contents: read
  actions: read

jobs:
  examples:
    if: inputs.experiment == 'all' || inputs.experiment == 'examples'
    uses: ./.github/workflows/kernel-repository.yml

  generator:
    if: inputs.experiment != 'examples'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      USE_BAZEL_VERSION: 9.1.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: torvalds/linux
          ref: 0fcb05b72344f40806cbe810de8872f1698bf053
          path: _tmp/linux
          persist-credentials: false
      - name: Declare the compressed image's assembler input
        run: git -C _tmp/linux apply "$GITHUB_WORKSPACE/native/linux_piggy_dependency.patch"
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: kernel-repository
          repository-cache: true
      - name: Build and test the current generator
        run: |
          bazel test //:prototype_test //:repository_test --platforms=@llvm//platforms:linux_x86_64_musl --jobs=4 --test_output=errors
          bazel build //:consumer_support --platforms=@llvm//platforms:linux_x86_64_musl --jobs=4
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-generator
          path: bazel-bin/consumer-support.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qualification-generator-logs
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/repository_test/test.outputs/**
          retention-days: 14

  qualify:
    name: ${{ matrix.experiment }}
    runs-on: ubuntu-24.04
    needs: generator
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        experiment: ${{ inputs.experiment == 'all' && fromJSON('["configuration-parity", "source-edit-reuse"]') || fromJSON(format('["{0}"]', inputs.experiment)) }}
    env:
      USE_BAZEL_VERSION: 9.1.0
    steps:
      - uses: actions/checkout@v5
      - name: Checkout the generator's pinned kernel
        uses: actions/checkout@v5
        with:
          repository: torvalds/linux
          ref: 0fcb05b72344f40806cbe810de8872f1698bf053
          path: _tmp/linux
          persist-credentials: false
      - name: Declare the compressed image's assembler input
        run: git -C _tmp/linux apply "$GITHUB_WORKSPACE/native/linux_piggy_dependency.patch"
      - uses: actions/download-artifact@v8
        with:
          name: qualification-generator
          path: _tmp/kernel-repository
      - name: Configure the consumer with the current generator
        run: |
          mkdir -p "$RUNNER_TEMP/linux-prototype-qualification" _tmp/kernel-repository
          tar -xzf _tmp/kernel-repository/consumer-support.tar.gz -C _tmp/kernel-repository
          python3 example.py --generated _tmp/kernel-repository/support
      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: prototype-qualification-${{ matrix.experiment }}
          repository-cache: true
      - name: Compare native and prototype configurations
        if: matrix.experiment == 'configuration-parity'
        working-directory: examples
        run: bazel test //qualification:parity --jobs=4 --keep_going --test_output=errors
      - name: Check the reuse reporter
        if: matrix.experiment == 'source-edit-reuse'
        working-directory: examples
        run: bazel test //qualification:reuse_report_test --test_output=errors
      - name: Fetch the compact execution log decoder
        if: matrix.experiment == 'source-edit-reuse'
        run: |
          decoder="$RUNNER_TEMP/linux-prototype-qualification/bb"
          curl --fail --location --output "$decoder" https://github.com/buildbuddy-io/bazel/releases/download/5.0.492/bazel-5.0.492-linux-x86_64
          echo "e9e996a1a01555e45433acf9432f9d40d5bda437812a830d6701fe9b09853df9  $decoder" | sha256sum --check
          chmod +x "$decoder"
      - name: Measure unchanged and edited source builds
        if: matrix.experiment == 'source-edit-reuse'
        working-directory: examples
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/linux-prototype-qualification"
          source_file="$GITHUB_WORKSPACE/_tmp/linux/init/main.c"
          header_file="$GITHUB_WORKSPACE/_tmp/linux/init/do_mounts.h"
          payload_file="$GITHUB_WORKSPACE/_tmp/linux/usr/default_cpio_list"
          cp "$source_file" "$results/main.c.original"
          cp "$header_file" "$results/do_mounts.h.original"
          cp "$payload_file" "$results/default_cpio_list.original"
          trap 'cp "$results/main.c.original" "$source_file"; cp "$results/do_mounts.h.original" "$header_file"; cp "$results/default_cpio_list.original" "$payload_file"' EXIT
          for phase in baseline unchanged edited header incbin; do
            case "$phase" in
              edited) printf '\n/* prototype reuse experiment %s/%s */\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$source_file" ;;
              header) printf '\n/* prototype header experiment %s/%s */\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$header_file" ;;
              incbin) printf '\ndir /linux-bzl-incbin-%s-%s 0755 0 0\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$payload_file" ;;
            esac
            bazel build //:x86_64_kernel --jobs=4 \
              --sandbox_block_path=/bin --sandbox_block_path=/usr/bin --sandbox_block_path=/usr/local/bin \
              --execution_log_compact_file="$results/$phase.execution.pb.zst"
            # Decode compact entries without expanding every action's source-tree inputs.
            "$results/bb" print --compact_execution_log="$results/$phase.execution.pb.zst" --raw=true --sort=false |
              jq -c '
                if has("invocation") then {invocation: .invocation.id}
                elif has("file") then {id, path: .file.path}
                elif has("directory") then {id, path: .directory.path}
                elif has("unresolvedSymlink") then {id, path: .unresolvedSymlink.path}
                elif has("spawn") then {spawn: (.spawn | {
                  outputs: (.outputs // []), mnemonic, runner: (.runner // ""),
                  cacheHit: (.cacheHit // false),
                  exitCode: (.exitCode // 0),
                  status: (.status // "")
                })}
                else empty end
              ' > "$results/$phase.execution.jsonl"
            bazel aquery 'mnemonic("CppCompile|Assemble|KbuildCC", deps(//:x86_64_kernel)) union outputs(".*[.]artifacts/(usr/initramfs_inc_data|[.]vmlinux.export.c)", deps(//:x86_64_kernel))' \
              --output=jsonproto --include_commandline=false > "$results/$phase.aquery.json"
            bazel run //qualification:reuse_report -- snapshot "$results" "$phase"
          done
          bazel run //qualification:reuse_report -- report "$results"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prototype-${{ matrix.experiment }}
          path: |
            ${{ runner.temp }}/linux-prototype-qualification/*.json
            ${{ runner.temp }}/linux-prototype-qualification/*.jsonl
            ${{ runner.temp }}/linux-prototype-qualification/*.pb.zst
            examples/bazel-testlogs/qualification/**/test.log
            examples/bazel-testlogs/qualification/**/test.outputs/**
          retention-days: 14

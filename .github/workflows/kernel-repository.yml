name: Kernel repository prototype

on:
  pull_request:
  push:
    branches:
      - prototype/static-kernel-repository
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kernel-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-generator:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_x86_64_musl
          - os: macos-15
            platform: macos_aarch64
    timeout-minutes: 45
    env:
      USE_BAZEL_VERSION: 9.1.0
    steps:
      - uses: actions/checkout@v5

      - name: Install tracing tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y strace

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: kernel-repository-${{ matrix.platform }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Test prototype helpers and formatting
        run: bazel test //... --jobs=4 --test_output=errors

      - name: Check native Kconfig source APIs
        run: >-
          bazel test //:kconfig_test
          //native/linux_5_10:kconfig_test //native/linux_5_15:kconfig_test
          //native/linux_6_1:kconfig_test //native/linux_6_6:kconfig_test
          //native/linux_6_12:kconfig_test //native/linux_6_18:kconfig_test
          --platforms=@llvm//platforms:${{ matrix.platform }} --jobs=4 --test_output=errors

      - name: Build generator from source
        run: bazel build //:consumer_support --platforms=@llvm//platforms:${{ matrix.platform }} --jobs=4

      - name: Audit standalone generation
        shell: bash
        run: |
          trace=()
          if [[ "$RUNNER_OS" == Linux ]]; then trace+=(--test_arg=--strace); fi
          bazel test //:repository_test --platforms=@llvm//platforms:${{ matrix.platform }} --jobs=4 "${trace[@]}" --test_output=errors

      - name: Upload consumer support
        uses: actions/upload-artifact@v7
        with:
          name: kernel-repository-consumer-${{ matrix.platform }}
          path: bazel-bin/consumer-support.tar.gz
          retention-days: 7

      - name: Build and audit LTS generators
        shell: bash
        run: |
          trace=()
          if [[ "$RUNNER_OS" == Linux ]]; then trace+=(--test_arg=--strace); fi
          bazel build \
            //native/linux_5_10:consumer_support //native/linux_5_15:consumer_support \
            //native/linux_6_1:consumer_support //native/linux_6_6:consumer_support \
            //native/linux_6_12:consumer_support //native/linux_6_18:consumer_support \
            --platforms=@llvm//platforms:${{ matrix.platform }} --jobs=4
          bazel test \
            //native/linux_5_10:repository_test //native/linux_5_15:repository_test \
            //native/linux_6_1:repository_test //native/linux_6_6:repository_test \
            //native/linux_6_12:repository_test //native/linux_6_18:repository_test \
            --platforms=@llvm//platforms:${{ matrix.platform }} --jobs=4 "${trace[@]}" --test_output=errors

      - name: Upload LTS consumer support
        uses: actions/upload-artifact@v7
        with:
          name: kernel-repository-consumer-lts-${{ matrix.platform }}
          path: |
            bazel-bin/native/linux_5_10/consumer-support.tar.gz
            bazel-bin/native/linux_5_15/consumer-support.tar.gz
            bazel-bin/native/linux_6_1/consumer-support.tar.gz
            bazel-bin/native/linux_6_6/consumer-support.tar.gz
            bazel-bin/native/linux_6_12/consumer-support.tar.gz
            bazel-bin/native/linux_6_18/consumer-support.tar.gz
          retention-days: 7

      - name: Upload generation diagnostics and executable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kernel-repository-prototype-${{ matrix.platform }}
          path: |
            bazel-bin/kernel-repository
            bazel-testlogs/repository_test/test.log
            bazel-testlogs/repository_test/test.outputs/**
            bazel-bin/native/linux_6_18/kernel-repository
            bazel-testlogs/native/linux_6_18/repository_test/test.log
            bazel-testlogs/native/linux_6_18/repository_test/test.outputs/**
            bazel-testlogs/native/linux_6_12/repository_test/test.log
            bazel-testlogs/native/linux_6_12/repository_test/test.outputs/**
            bazel-testlogs/native/linux_6_6/repository_test/test.log
            bazel-testlogs/native/linux_6_6/repository_test/test.outputs/**
            bazel-testlogs/native/linux_6_1/repository_test/test.log
            bazel-testlogs/native/linux_6_1/repository_test/test.outputs/**
            bazel-testlogs/native/linux_5_15/repository_test/test.log
            bazel-testlogs/native/linux_5_15/repository_test/test.outputs/**
            bazel-testlogs/native/linux_5_10/repository_test/test.log
            bazel-testlogs/native/linux_5_10/repository_test/test.outputs/**
            bazel-testlogs/**/kconfig_test/test.log
          if-no-files-found: warn
          retention-days: 7

  examples:
    name: Example / ${{ matrix.example }}
    needs: static-generator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      USE_BAZEL_VERSION: 9.1.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: x86_64
            test: //:x86_64_config_test
            build: //:x86_64_kernel //:x86_64_kernel_system_map //:x86_64_kernel_config_file
          - example: aarch64
            test: //:aarch64_config_test
            build: //:aarch64_kernel //:aarch64_kernel_system_map //:aarch64_kernel_config_file
          - example: debug
            test: //:debug_config_test
            build: //:x86_64_debug_kernel
          - example: lz4
            test: //:lz4_config_test
            build: //:x86_64_lz4_kernel
          - example: btf-capability-gap
            test: //:btf_capability_test
            build: //:x86_64_btf_vmlinux_config
          - example: btf-declared-tool
            test: //:btf_declared_config_test @kernel//:pahole_test
            build: //:x86_64_btf_declared_config
          - example: initramfs
            build: //:example_initramfs
          - example: graph-metadata
            build: //:x86_64_shared_graph_metadata
          - example: platforms
            test: >-
              @kernel//architecture_tests:multi_platform_test
              @kernel//architecture_tests:x86_32_test
              @kernel//architecture_tests:unsupported_cpu_test
              @kernel//architecture_tests:x86_64_test
              @kernel//architecture_tests:aarch64_test
              @kernel//architecture_tests:riscv64_test
              @kernel//architecture_tests:conflicting_width_test
              @kernel//architecture_tests:selected_compiler_capabilities_test
              @kernel//architecture_tests:recursive_flags_test
              @kernel//architecture_tests:native_shell_test
            build: '@kernel//multi_platform:configs @linux.bzl//execution_tools:check'
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pinned kernel input
        uses: actions/checkout@v5
        with:
          repository: torvalds/linux
          ref: 0fcb05b72344f40806cbe810de8872f1698bf053
          path: _tmp/linux
          persist-credentials: false

      - name: Declare the compressed image's assembler input
        run: git -C _tmp/linux apply "$GITHUB_WORKSPACE/native/linux_piggy_dependency.patch"

      - uses: actions/download-artifact@v8
        with:
          name: kernel-repository-consumer-linux_x86_64_musl
          path: _tmp/kernel-repository

      - name: Configure repository-rule consumer
        run: |
          tar -xzf _tmp/kernel-repository/consumer-support.tar.gz -C _tmp/kernel-repository
          python3 example.py --generated _tmp/kernel-repository/support

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: example-${{ matrix.example }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Test example analysis
        if: ${{ matrix.test != '' }}
        working-directory: examples
        env:
          TEST_TARGETS: ${{ matrix.test }}
        run: |
          read -r -a targets <<< "$TEST_TARGETS"
          bazel test "${targets[@]}" --jobs=4 --test_output=errors

      - name: Build example with host tools blocked
        working-directory: examples
        env:
          BUILD_TARGETS: ${{ matrix.build }}
        run: |
          read -r -a targets <<< "$BUILD_TARGETS"
          bazel build "${targets[@]}" --output_groups=+boot --jobs=4 \
            --sandbox_block_path=/bin --sandbox_block_path=/usr/bin \
            --sandbox_block_path=/usr/local/bin

      - name: Upload example test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: example-${{ matrix.example }}-logs
          path: examples/bazel-testlogs/**/test.log
          if-no-files-found: ignore
          retention-days: 7

  lts-kernels:
    name: ${{ matrix.source }} / x86 and ARM64 boot images, BTF and modules
    needs: static-generator
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source: [linux_5_10, linux_5_15, linux_6_1, linux_6_6, linux_6_12, linux_6_18]
    timeout-minutes: 90
    env:
      USE_BAZEL_VERSION: 9.1.0
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.source }}-kernels
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - uses: actions/download-artifact@v8
        with:
          name: kernel-repository-consumer-lts-linux_x86_64_musl
          path: _tmp/kernel-repository

      - name: Configure the declared LTS source consumer
        run: |
          source_anchor=$(bazel cquery @${{ matrix.source }}//:Makefile --output=files)
          source_root="$(bazel info output_base)/$(dirname "$source_anchor")"
          tar -xzf _tmp/kernel-repository/${{ matrix.source }}/consumer-support.tar.gz -C _tmp/kernel-repository
          python3 example.py --linux "$source_root" --generated _tmp/kernel-repository/support

      - name: Build x86 and ARM64 BTF kernels, boot images and ingress modules
        working-directory: examples
        run: |
          bazel --host_jvm_args=-Xmx8g build //:aarch64_modules //:x86_64_modules --output_groups=kernel,boot,modules --jobs=4 \
            --sandbox_block_path=/bin --sandbox_block_path=/usr/bin \
            --sandbox_block_path=/usr/local/bin
          bazel --host_jvm_args=-Xmx8g test //:aarch64_modules_btf_test //:x86_64_modules_btf_test //:x86_64_config_test --jobs=4 --test_output=errors

      - name: Upload LTS test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.source }}-kernel-logs
          path: examples/bazel-testlogs/**/test.log
          if-no-files-found: ignore
          retention-days: 7

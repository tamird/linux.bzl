name: Kernel repository prototype

on:
  pull_request:
  push:
    branches:
      - prototype/static-kernel-repository
  workflow_dispatch:
    inputs:
      verify_only:
        description: Qualify generators and declared capabilities without building images
        type: boolean
        default: false
  workflow_call:
    inputs:
      verify_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-generator-linux:
    uses: ./.github/workflows/kernel-generator.yml
    with:
      os: ubuntu-24.04
      platform: linux_x86_64_musl

  static-generator-macos:
    uses: ./.github/workflows/kernel-generator.yml
    with:
      os: macos-15
      platform: macos_aarch64

  examples:
    if: ${{ !inputs.verify_only }}
    name: Example / ${{ matrix.example }}
    needs: static-generator-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      USE_BAZEL_VERSION: 9.1.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: x86_64
            test: //:x86_64_config_test
            build: //:x86_64_kernel //:x86_64_kernel_system_map //:x86_64_kernel_config_file
          - example: aarch64
            test: //:aarch64_config_test
            build: //:aarch64_kernel //:aarch64_kernel_system_map //:aarch64_kernel_config_file
          - example: debug
            test: //:debug_config_test
            build: //:x86_64_debug_kernel
          - example: lz4
            test: //:lz4_config_test
            build: //:x86_64_lz4_kernel
          - example: btf-capability-gap
            test: //:btf_capability_test
            build: //:x86_64_btf_vmlinux_config
          - example: btf-declared-tool
            test: //:btf_declared_config_test @kernel//:pahole_test
            build: //:x86_64_btf_declared_config
          - example: initramfs
            build: //:example_initramfs
          - example: graph-metadata
            build: //:x86_64_shared_graph_metadata
          - example: platforms
            test: >-
              @kernel//architecture_tests:multi_platform_test
              @kernel//architecture_tests:x86_32_test
              @kernel//architecture_tests:unsupported_cpu_test
              @kernel//architecture_tests:x86_64_test
              @kernel//architecture_tests:aarch64_test
              @kernel//architecture_tests:riscv64_test
              @kernel//architecture_tests:conflicting_width_test
              @kernel//architecture_tests:selected_compiler_capabilities_test
              @kernel//architecture_tests:recursive_flags_test
              @kernel//architecture_tests:realmode_flags_test
              @kernel//architecture_tests:compiler_controls_test
              @kernel//architecture_tests:config_flags_test
              @kernel//architecture_tests:choice_visibility_test
              @kernel//architecture_tests:native_cpu_test
              @kernel//architecture_tests:native_shell_test
            build: '@kernel//multi_platform:configs @linux.bzl//execution_tools:check'
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pinned kernel input
        uses: actions/checkout@v5
        with:
          repository: torvalds/linux
          ref: 0fcb05b72344f40806cbe810de8872f1698bf053
          path: _tmp/linux
          persist-credentials: false

      - name: Declare the compressed image's assembler input
        run: git -C _tmp/linux apply "$GITHUB_WORKSPACE/native/linux_piggy_dependency.patch"

      - uses: actions/download-artifact@v8
        with:
          name: kernel-repository-consumer-linux_x86_64_musl
          path: _tmp/kernel-repository

      - name: Configure repository-rule consumer
        run: |
          tar -xzf _tmp/kernel-repository/consumer-support.tar.gz -C _tmp/kernel-repository
          python3 example.py --generated _tmp/kernel-repository/support

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: example-${{ matrix.example }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Test example analysis
        if: ${{ matrix.test != '' }}
        working-directory: examples
        env:
          TEST_TARGETS: ${{ matrix.test }}
        run: |
          read -r -a targets <<< "$TEST_TARGETS"
          mkdir -p "$RUNNER_TEMP/kernel-profiles"
          bazel test "${targets[@]}" --jobs=4 --test_output=errors \
            --profile="$RUNNER_TEMP/kernel-profiles/analysis.profile.gz" \
            --experimental_sandbox_async_tree_delete_idle_threads=0

      - name: Build example with host tools blocked
        # Leave job time for evidence upload and cache post steps.
        timeout-minutes: 150
        working-directory: examples
        env:
          BUILD_TARGETS: ${{ matrix.build }}
        run: |
          read -r -a targets <<< "$BUILD_TARGETS"
          mkdir -p "$RUNNER_TEMP/kernel-profiles"
          # Apply backpressure when retiring the native build's sandboxes.
          bazel build "${targets[@]}" --output_groups=+boot --jobs=4 \
            --profile="$RUNNER_TEMP/kernel-profiles/build.profile.gz" \
            --experimental_sandbox_async_tree_delete_idle_threads=0 \
            --sandbox_block_path=/bin --sandbox_block_path=/usr/bin \
            --sandbox_block_path=/usr/local/bin

      - name: Upload example test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-${{ matrix.example }}-logs
          path: |
            examples/bazel-testlogs/**/test.log
            ${{ runner.temp }}/kernel-profiles/*.profile.gz
          if-no-files-found: ignore
          retention-days: 7

  lts-kernels:
    name: ${{ matrix.source }} / x86 and ARM64 boot images, BTF and modules
    needs: static-generator-linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source: [linux_5_10, linux_5_15, linux_6_1, linux_6_6, linux_6_12, linux_6_18]
    timeout-minutes: 180
    env:
      USE_BAZEL_VERSION: 9.1.0
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.source }}-kernels
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - uses: actions/download-artifact@v8
        with:
          name: kernel-repository-consumer-lts-linux_x86_64_musl
          path: _tmp/kernel-repository

      - name: Configure the declared LTS source consumer
        run: |
          source_anchor=$(bazel cquery @${{ matrix.source }}//:Makefile --output=files)
          source_root="$(bazel info output_base)/$(dirname "$source_anchor")"
          tar -xzf _tmp/kernel-repository/${{ matrix.source }}/consumer-support.tar.gz -C _tmp/kernel-repository
          python3 example.py --linux "$source_root" --generated _tmp/kernel-repository/support

      - name: Verify declared target toolchain capabilities
        working-directory: examples
        run: |
          mkdir -p ../_tmp/capability-reports
          bazel --host_jvm_args=-Xmx8g test @kernel//architecture_tests:realmode_flags_test \
            @kernel//architecture_tests:config_flags_test @kernel//architecture_tests:choice_visibility_test \
            @kernel//architecture_tests:native_shell_test \
            --platforms=@llvm//platforms:linux_x86_64 \
            --extra_execution_platforms=@llvm//platforms:linux_x86_64 --jobs=4 --test_output=errors
          # Musl's stdarg header exposes hosted endian aliases; native kernel
          # commands must select compiler builtins, including -S/-E generators.
          bazel --host_jvm_args=-Xmx8g build @kernel//architecture_tests:header_context_checks \
            --platforms=@llvm//platforms:linux_aarch64_musl \
            --extra_execution_platforms=@llvm//platforms:linux_x86_64 --jobs=4
          verification_status=0
          for cpu in x86_64 aarch64; do
            flags=(--platforms=@llvm//platforms:linux_$cpu --extra_execution_platforms=@llvm//platforms:linux_x86_64)
            report=$(bazel --host_jvm_args=-Xmx8g cquery @kernel//:compiler_capability_checks "${flags[@]}" --output=files | sed -n '/\.report\.json$/p')
            if bazel --host_jvm_args=-Xmx8g build @kernel//:compiler_capability_checks "${flags[@]}" --jobs=4; then
              cp "$report" "../_tmp/capability-reports/$cpu.json"
            else
              verification_status=$?
              if [[ -f "$report" ]]; then cp "$report" "../_tmp/capability-reports/$cpu.json" || true; fi
            fi
          done
          exit "$verification_status"

      - name: Build x86 and ARM64 BTF kernels, boot images and ingress modules
        if: ${{ !inputs.verify_only }}
        # Leave job time for evidence upload and cache post steps.
        timeout-minutes: 150
        working-directory: examples
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-profiles"
          # Apply backpressure when retiring the native build's sandboxes.
          bazel --host_jvm_args=-Xmx8g build //:aarch64_modules //:x86_64_modules --output_groups=kernel,boot,modules --jobs=4 \
            --profile="$RUNNER_TEMP/kernel-profiles/build.profile.gz" \
            --experimental_sandbox_async_tree_delete_idle_threads=0 \
            --sandbox_block_path=/bin --sandbox_block_path=/usr/bin \
            --sandbox_block_path=/usr/local/bin
          bazel --host_jvm_args=-Xmx8g test //:aarch64_modules_btf_test //:x86_64_modules_btf_test //:x86_64_config_test --jobs=4 --test_output=errors \
            --profile="$RUNNER_TEMP/kernel-profiles/test.profile.gz" \
            --experimental_sandbox_async_tree_delete_idle_threads=0

      - name: Upload LTS test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.source }}-kernel-logs
          path: |
            examples/bazel-testlogs/**/test.log
            _tmp/capability-reports/*.json
            ${{ runner.temp }}/kernel-profiles/*.profile.gz
          if-no-files-found: ignore
          retention-days: 7
